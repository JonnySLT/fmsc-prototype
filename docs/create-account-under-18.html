<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account (under 18) · FMSC</title>
<meta name="description" content="Create account page, under-18 state, for the FMSC.org usability test, built from the FMSC Design System.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; components bring their own styles. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  .ca-link { color: var(--content-link); text-decoration: none; }
  .ca-link:hover { text-decoration: underline; }
  .ca-secondary { color: var(--content-secondary); }

  /* "Main": account panel (618) | form column (822). The form comes first in the DOM (h1 first); the grid puts the panel left. */
  .ca-main { display: grid; grid-template-columns: 618fr 822fr; }
  .ca-panel { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; align-items: flex-start;
    padding: var(--section-y) var(--space-0) var(--section-y) var(--margin-x); background: var(--background-brand-subtle); }
  .ca-panel__content { display: flex; flex-direction: column; gap: var(--space-lg); width: 100%; max-width: 384px; }
  .ca-checklist { display: flex; flex-direction: column; gap: var(--item-y); }
  .ca-formcol { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: flex-end;
    padding: var(--section-y) var(--margin-x) var(--section-y) var(--space-0); min-width: 0; }

  /* "1 · Account form" card: surface fill, subtle border, 12 radius */
  .ca-card { width: 100%; max-width: 588px; display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-lg); padding: var(--card-pad);
    background: var(--background-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  .ca-card > * { max-width: 100%; }
  .ca-fields, .ca-card .fm-divider, .ca-social, .ca-card > h1 { width: 100%; }
  .ca-fields { display: flex; flex-direction: column; gap: var(--space-md); }
  .ca-fields .fm-input { width: 100%; }
  .ca-namerow { display: flex; gap: var(--space-md); }
  .ca-namerow > * { flex: 1 1 0; min-width: 0; }
  .ca-age { display: flex; flex-direction: column; gap: var(--space-sm); }
  .ca-age__options { display: flex; gap: var(--space-lg); }
  /* Volunteers under 18 */
  .ca-u18 { display: flex; flex-direction: column; gap: var(--space-sm); }
  .ca-notice { display: flex; align-items: flex-start; gap: var(--space-sm); padding: var(--space-md); border-radius: var(--radius-md);
    background: var(--feedback-info-subtle); color: var(--content-primary); }
  .ca-notice .fm-icon { flex: none; }
  .ca-ways { display: flex; flex-direction: column; gap: var(--space-xs); color: var(--content-secondary); }
  /* Figma quirk (reported): the newsletter checkbox's label is centred in its text column; the description is left-aligned */
  .ca-news .fm-check__label { align-self: center; }
  .ca-social { display: flex; gap: var(--space-sm); }
  .ca-social > * { flex: 1 1 0; min-width: 0; }

  /* Photo collage: four tilted photo cards; positions are the Figma group's, in % so it scales with the column */
  .ca-collage { position: relative; width: 100%; max-width: 384px; aspect-ratio: 384 / 314; flex: none; }
  .ca-collage--m { max-width: 361px; aspect-ratio: 361 / 193; }
  .ca-photo { position: absolute; transform-origin: 0 0; overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  .ca-photo img { width: 100%; height: 100%; object-fit: cover; }
  /* Figma: 5.47px inside stroke in background/surface */
  .ca-photo::after { content: ''; position: absolute; inset: 0; border: 5.5px solid var(--background-surface); border-radius: inherit; pointer-events: none; }

  /* 880–1279 (between Figma breakpoints): the 0 inner paddings would let the collage and card meet; give them a gutter */
  @media (max-width: 1279.98px) {
    .ca-panel { padding-right: var(--space-xl); }
    .ca-formcol { padding-left: var(--space-xl); }
  }
  /* 600–879: desktop design stacked (form, then panel), hamburger nav */
  @media (max-width: 879.98px) {
    .ca-main { grid-template-columns: 1fr; }
    .ca-formcol { grid-column: 1; grid-row: 1; align-items: center; padding: var(--section-y) var(--space-2xl); }
    .ca-panel { grid-column: 1; grid-row: 2; align-items: center; padding: var(--section-y) var(--space-2xl); }
    .ca-panel__content { max-width: 588px; }
    .ca-panel .ca-collage { align-self: center; }
  }
  /* < 600: the "Mobile/Account/Create account" frame */
  @media (max-width: 599.98px) {
    .ca-formcol { padding: var(--section-y) var(--margin-x); }
    .ca-panel { align-items: stretch; padding: var(--section-y) var(--margin-x); }
    .ca-panel__content { max-width: none; }
    .ca-panel .ca-collage { align-self: flex-start; }
    .ca-namerow { flex-direction: column; }
    .ca-namerow > * { flex: none; }
    .ca-social { flex-direction: column; }
    .ca-social > * { flex: none; }
    .ca-card > .fm-btn { width: 100%; }
    /* Footer: DS mobile columns keep the desktop 140px flex-basis, which becomes height in the column stack */
    .ca-page .fm-footer--mobile .fm-footer__col, .ca-page .fm-footer--mobile .fm-footer__brand { flex: none; }
  }
  /* Footer: the frame's legal line runs on one line beside the seals (DS caps it at 756px) */
  .ca-page .fm-footer--desktop .fm-footer__legal-copy { max-width: none; }
</style>
</head>
<body class="ca-page">
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="flow-data.js"></script>
<script>
  var F = window.FMSC, h = React.createElement, Fragment = React.Fragment;
  var img = function (n) { return 'img/' + n; };
  function inert(e) { e.preventDefault(); }

  /* This file is create-account-under-18.html: "Are you 18 or older?" opens with No selected (as in its Figma frame).
     No on create-account.html opens create-account-under-18.html; Yes on the Under 18 page opens create-account.html.
     What was typed rides along in sessionStorage (read once, then cleared), so the switch keeps the form. */
  var UNDER18 = true;
  var DRAFT_KEY = 'fmsc-create-draft';
  var draft = (function () {
    try { var v = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null'); sessionStorage.removeItem(DRAFT_KEY); return v || {}; } catch (e) { return {}; }
  })();

  /* Collage cards: [image, alt, x, y, w, h, CSS rotation] in the Figma group's px (desktop 384 × 314, mobile 361 × 193).
     Figma rotation is counter-clockwise, so CSS rotate is its negative; both rotate about the card's top-left. */
  var COLLAGE = {
    w: 384, h: 314, cards: [
      ['auth-volunteers-table.jpg', 'Volunteers in hairnets and teal shirts packing meals around a table', 196.7, 0, 155.1, 153.2, 3.12],
      ['auth-kids-thumbs-up.jpg', 'Students in blue uniforms at their desks, one giving a thumbs-up', 9.4, 36.8, 195.8, 139.9, 4.16],
      ['auth-volunteer-smiling.jpg', 'A smiling volunteer in a hairnet on a busy packing line', 28.8, 141.3, 155.1, 153.2, 3.12],
      ['auth-child-eating.jpg', 'A boy eating a meal with a spoon', 161.5, 152.6, 214.6, 161.6, -3.12]
    ] };
  var COLLAGE_M = {
    w: 361, h: 193, cards: [
      ['auth-volunteer-smiling.jpg', 'A smiling volunteer in a hairnet on a busy packing line', 15.8, 4, 188, 172, 4],
      ['auth-child-eating.jpg', 'A boy eating a meal with a spoon', 153.8, 22, 195, 163, -3]
    ] };
  function pct(v, of) { return (v / of * 100) + '%'; }
  function Collage(p) {
    var c = p.data;
    return h('div', { className: 'ca-collage' + (p.mobile ? ' ca-collage--m' : '') },
      c.cards.map(function (k) {
        return h('div', { key: k[0], className: 'ca-photo', style: { left: pct(k[2], c.w), top: pct(k[3], c.h), width: pct(k[4], c.w), height: pct(k[5], c.h), transform: 'rotate(' + k[6] + 'deg)' } },
          h('img', { src: img(k[0]), alt: k[1] }));
      }));
  }

  /* Google mark: the Figma Social sign-in button draws the outlined "brand-google" glyph, which the DS icon set lacks
     (DS renders a placeholder circle). Same stroke style as the DS icons. */
  var GOOGLE_MARK = h('svg', { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', 'aria-hidden': 'true' },
    h('path', { d: 'M20.945 11a9 9 0 1 1 -3.284 -5.997l-2.655 2.392a5.5 5.5 0 1 0 2.119 6.605h-4.125v-3h7.945z', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }));

  function createAccount(e) { if (e) e.preventDefault(); window.FMSCAuth.createAccount(); window.FMSCAuth.go('account-dashboard.html'); }

  var CHECKLIST = [
    ['package', 'See what you’ve packed', 'Your meals, hours and the countries they reach, shift by shift.'],
    ['calendar-time', 'Book your next shift faster', 'Your details are saved, so reserving takes less time.'],
    ['users', 'Bring your family', 'Add the people you pack with and sign them up together.'],
    ['file-text', 'Find receipts at tax time', 'Every gift receipt in one place.']
  ];

  function CreateAccountPage() {
    var mobile = F.useIsMobile();
    var s = React.useState({ first: draft.first || '', last: draft.last || '', email: draft.email || '', phone: draft.phone || '', password: '', news: !!draft.news });
    var form = s[0], setForm = s[1];
    var a = React.useState(UNDER18 ? 'no' : ''), adult = a[0], setAdult = a[1];
    function set(k) { return function (e) { var v = e.target.type === 'checkbox' ? e.target.checked : e.target.value; setForm(function (f) { var n = Object.assign({}, f); n[k] = v; return n; }); }; }
    function pickAge(v) {
      setAdult(v);
      var to = v === 'no' && !UNDER18 ? 'create-account-under-18.html' : v === 'yes' && UNDER18 ? 'create-account.html' : null;
      if (!to) return;
      try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ first: form.first, last: form.last, email: form.email, phone: form.phone, news: form.news })); } catch (e) {}
      window.FMSCAuth.go(to);
    }
    function field(k, label, extra) {
      return h(F.Input, Object.assign({ id: 'ca-' + k, name: k, label: label, value: form[k], onChange: set(k) }, extra || {}));
    }
    return h(Fragment, null,
      h(window.SiteNav, {}),
      h('main', { className: 'ca-main' },
        /* 1 · Account form */
        h('section', { className: 'ca-formcol', 'aria-labelledby': 'ca-title' },
          h('form', { className: 'ca-card', onSubmit: createAccount, noValidate: true },
            h('h1', { id: 'ca-title', className: mobile ? 'heading-h2-mobile' : 'heading-h2' }, 'Create your FMSC account'),
            h('div', { className: 'ca-fields' },
              h('div', { className: 'ca-namerow' },
                field('first', 'First name', { autoComplete: 'given-name' }),
                field('last', 'Last name', { autoComplete: 'family-name' })),
              h('div', { className: 'ca-age', role: 'radiogroup', 'aria-labelledby': 'ca-age-label' },
                h('p', { id: 'ca-age-label', className: 'label-small' }, 'Are you 18 or older?'),
                h('div', { className: 'ca-age__options' },
                  h(F.Radio, { name: 'ca-adult', value: 'yes', label: 'Yes', checked: adult === 'yes', onChange: function () { pickAge('yes'); } }),
                  h(F.Radio, { name: 'ca-adult', value: 'no', label: 'No', checked: adult === 'no', onChange: function () { pickAge('no'); } }))),
              UNDER18 && h('section', { className: 'ca-u18', 'aria-labelledby': 'ca-u18-title' },
                h('h2', { id: 'ca-u18-title', className: 'label-base' }, 'Volunteering under 18'),
                h('div', { className: 'ca-notice', role: 'note' },
                  h(F.Icon, { name: 'info-circle', size: 20 }),
                  h('p', { className: 'body-small' }, 'Volunteers under 18 sign up through an adult.')),
                h('div', { className: 'ca-ways' },
                  h('p', { className: 'body-small' }, 'A group admin can add you to their reservation with your first and last name.'),
                  h('p', { className: 'body-small' }, 'A parent can add you to their account as a family member.'),
                  h('p', { className: 'body-small' }, 'Need community service hours? Each site verifies them a little differently, so check with the site where you’re packing.'))),
              field('email', 'Email', { type: 'email', autoComplete: 'email' }),
              field('phone', 'Phone (optional)', { type: 'tel', autoComplete: 'tel' }),
              field('password', 'Password', { type: 'password', autoComplete: 'new-password', description: 'Use at least 8 characters, with a capital letter, a number and a special character.' })),
            h(F.Checkbox, { className: 'ca-news', name: 'news', label: 'Send me impact stories and FMSC news', description: 'We’ll still send the essentials, like reservation reminders and receipts.', checked: form.news, onChange: set('news') }),
            h('p', { className: 'caption ca-secondary' }, 'By creating an account, you agree to FMSC’s ',
              h('a', { className: 'ca-link', href: '#', onClick: inert }, 'terms of use'), ' and ',
              h('a', { className: 'ca-link', href: '#', onClick: inert }, 'privacy policy'), '.'),
            h(F.Button, { variant: 'primary', size: 'large', type: 'submit', label: 'Create account', fullWidth: mobile }),
            h(F.Divider, { label: 'or' }),
            h('div', { className: 'ca-social' },
              h(F.SocialSignInButton, { provider: 'google', mark: GOOGLE_MARK, type: 'button', fullWidth: true, label: mobile ? 'Continue with Google' : 'Google', onClick: createAccount }),
              h(F.SocialSignInButton, { provider: 'facebook', type: 'button', fullWidth: true, label: mobile ? 'Continue with Facebook' : 'Facebook', onClick: createAccount })),
            h('p', { className: 'body-small ca-secondary' }, 'Already have an account? ', h('a', { className: 'ca-link', href: 'sign-in.html' }, 'Sign in')))),

        /* 2 · What your account holds — panel */
        h('section', { className: 'ca-panel', 'aria-labelledby': 'ca-holds' },
          h('div', { className: 'ca-panel__content' },
            h(Collage, { data: mobile ? COLLAGE_M : COLLAGE, mobile: mobile }),
            h('h2', { id: 'ca-holds', className: mobile ? 'heading-h4-mobile' : 'heading-h4' }, 'Included with an FMSC.org account'),
            h('ul', { className: 'ca-checklist' },
              CHECKLIST.map(function (c) { return h(F.ChecklistItem, { key: c[1], as: 'li', breakpoint: 'auto', icon: c[0], title: c[1], detail: c[2], showDetail: true }); }))))),

      h(F.Footer, { breakpoint: 'auto',
        logoSrc: img('fmsc-logo-text-only.png'),
        columns: [
          { title: 'About FMSC', links: [{ label: 'Our mission', href: 'mission.html' }, 'Our story', 'What’s in a meal', 'Locations', 'Our finances', 'Leadership and board', 'Careers', 'News', 'Contact us'] },
          { title: 'Ways to help', links: [{ label: 'Volunteer at a packing event', href: 'volunteer.html' }, { label: 'Donate once or monthly', href: 'donate.html' }, { label: 'Start a fundraiser', href: 'fundraiser.html' }, { label: 'Shop FMSC MarketPlace™', href: 'marketplace.html' }, { label: 'Host an FMSC MobilePack™ event', href: 'host-mobilepack.html' }, { label: 'Attend a fundraising event', href: 'fundraising-events.html' }, { label: 'Plan an estate gift', href: 'estate-gift.html' }, { label: 'Corporate partnerships', href: 'corporate-partnerships.html' }] },
          { title: 'Resources', links: ['Common questions', 'Annual report', 'Food aid requests', 'Request a speaker', 'Partner resources', 'Press'] },
          { title: 'Account', links: [{ label: 'Sign in', href: 'sign-in.html' }, { label: 'Your impact', href: 'account-dashboard.html' }, { label: 'Receipts and tax documents', href: 'account-giving.html' }] },
          { title: 'Stay in touch', links: ['Email updates', 'Facebook', 'Instagram', 'YouTube', 'LinkedIn'] }
        ],
        seals: [img('seal-charity-navigator.png'), img('seal-candid.svg')]
      }));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(CreateAccountPage));
</script>
</body>
</html>
