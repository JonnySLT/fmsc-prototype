<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · Give meals · FMSC</title>
<meta name="description" content="Your gift to FMSC went through. Save it to an FMSC account.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; the flow shell and shared blocks (gv-) come from give-shell.js. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="flow-data.js"></script>
<script src="give-shell.js"></script>
<script>
  var F = window.FMSC, UI = window.GiveUI, Shell = window.GiveShell, h = React.createElement;
  /* Figma "Give — C4 Confirmation · Signed out": gift went through; offer to save it to a new account. */
  function Page() {
    var g = Shell.useGift('c', { details_daniel: Shell.people.daniel })[0], who = Shell.person('daniel'), m = Shell.fmt.meals(g.amount).toLocaleString('en-US');
    var total = g.amount + (g.fee ? Shell.fmt.fee(g.amount) : 0);
    return h(Shell, { confirm: true, summary: Shell.summary(g, { step: 4, totalLabel: 'Total charged' }),
        head: h(UI.Impact, { eyebrow: 'Your gift today', headline: 'You’re providing ' + m + ' meals.', link: true }) },
      h(UI.Confirmation, { title: 'Thanks' + (who.first ? ', ' + who.first : '') + '. Your ' + Shell.fmt.amt(total) + ' gift went through.',
          body: (g.amount === 106 ? 'It feeds a child a daily meal for a full year. ' : '') + (who.email ? 'We sent your receipt to ' + who.email + ' for your tax records.' : '') },
        /* "Save this gift to an FMSC account" only while still signed out: signing in from C2's dialog already saved it (Jonny, Oct. 29, 2026). */
        window.FMSCAuth && window.FMSCAuth.signedIn() ? null : h(UI.CreateAccount, { email: who.email })),
      h(UI.NextSteps, { tableBuilder: !Shell.fmt.monthlyNow(g) }) /* Table Builder card only after a one-time gift (Jonny, Oct. 29, 2026) */);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
