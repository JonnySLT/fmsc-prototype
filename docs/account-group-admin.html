<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Church Youth Group · FMSC</title>
<meta name="description" content="Grace Church Youth Group on FMSC: your group’s upcoming packing shifts, who’s in the group, inviting people and what the group has packed.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; shared account styles (ac-) come from account-shell.js.
     Figma: Desktop/Account/People & Groups/Group - Admin view (4656:66184) · Mobile (4656:96939). Prefix gp- (group pages). */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }

  .gp-muted { color: var(--content-secondary); }
  /* Figma breadcrumb and mobile back link use Body/Small Regular (the DS header sets them in Label/Small). */
  .fm-account-header__crumb, .fm-account-header__back { font-weight: 400; }
  /* Header under 880px wide (the DS stacks title and action): keep the action at its own width. */
  @container (max-width: 879.98px) { .fm-account-header:not(.fm-account-header--mobile) .fm-account-header__action { align-self: flex-start; } }

  /* Card headers: Figma sets the header bottom padding per card (0 on most, space-sm on the invite and packed cards). */
  .ac-card__header.gp-head { padding-bottom: var(--space-0); }
  .ac-card__header.gp-head--pad { padding-bottom: var(--space-sm); }
  .gp-head .fm-btn { flex: none; }
  .gp-heading { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-3xs); }

  /* Tables: Figma wraps the DS table in a border-default frame (radius-lg desktop, radius-xl mobile records). */
  .gp-table { width: 100%; overflow: hidden; border: 1px solid var(--border-default); border-radius: var(--radius-lg); }
  .gp-table .fm-dtable { width: 100%; }
  .gp-table .fm-dtable__table { width: 100%; table-layout: fixed; }
  .gp-table .fm-table-header:first-child, .gp-table .fm-table-cell:first-child { padding-left: var(--space-lg); }
  .gp-table .fm-pagination { border-top: 0; }
  /* Figma draws the sort chevron at the right edge of its column. */
  .gp-table .fm-table-header__sort { width: 100%; justify-content: space-between; min-height: 44px; margin: calc(-1 * var(--space-sm)) 0; }
  /* Row links: 44px hit area without moving the text. */
  .gp-table .fm-table-cell__link, .gp-table .fm-dtable__link { display: inline-block; padding: var(--space-sm) 0; margin: calc(-1 * var(--space-sm)) 0; }
  .gp-table .fm-table-cell a { color: var(--content-link); text-decoration: none; }
  .gp-table .fm-table-cell__secondary a { display: inline-block; padding: var(--space-md) 0; margin: calc(-1 * var(--space-md)) 0; }
  .gp-table .fm-table-cell a:hover { text-decoration: underline; }
  /* Mobile records (page-built, same classes as the DS Data table Mobile): the Figma record rule sits in the layout. */
  .gp-table .fm-dtable__record { box-shadow: none; border-bottom: 1px solid var(--border-subtle); }
  .gp-table .fm-dtable__record .fm-btn { margin-top: var(--space-0); }

  .gp-search { width: 360px; max-width: 100%; }
  .gp-foot { display: flex; align-items: center; gap: var(--space-md); }
  .gp-foot > p { flex: 1 1 0; min-width: 0; }
  .gp-foot .fm-btn { flex: none; }
  .gp-none { padding: var(--space-md) var(--space-lg); }

  /* Invite: Figma Segmented control track keeps its 1px stroke in the layout (54 tall; the DS draws it inset at 52). */
  .gp-invite .fm-invite__track { box-shadow: none; border: 1px solid var(--border-control); }
  .gp-invite .fm-invite:not(.fm-invite--mobile) { width: 100%; }

  /* What your group has packed: two lists side by side with a 1px divider. */
  .gp-two { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: var(--space-lg); }
  .gp-two__rule { background: var(--border-subtle); }
  .gp-list { display: flex; flex-direction: column; gap: var(--space-xs); min-width: 0; }
  .gp-rows { display: flex; flex-direction: column; gap: var(--space-md); margin: 0; }
  .gp-row { display: flex; justify-content: space-between; gap: var(--space-md); }
  .gp-row dt { color: var(--content-secondary); }
  .gp-row dd { margin: 0; text-align: right; color: var(--content-primary); }
  .gp-actions { display: flex; }

  @container ac-content (max-width: 639.98px) {
    .gp-two { grid-template-columns: minmax(0, 1fr); }
    .gp-two__rule { display: none; }
  }

  /* Mobile frame (393): below 600px */
  @media (max-width: 599.98px) {
    .ac-card.gp-card { gap: var(--space-sm); }
    .ac-card.gp-invite { gap: var(--space-md); }
    .gp-table { border-radius: var(--radius-xl); }
    .gp-search { width: 100%; }
    .gp-card > .fm-btn, .gp-foot .fm-btn, .gp-actions .fm-btn { width: 100%; }
    .gp-foot { flex-direction: column; align-items: stretch; gap: var(--space-md); }
    .gp-two { gap: var(--space-lg); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="account-shell.js"></script>
<script src="flow-data.js"></script>
<script>
  var F = window.FMSC, UI = window.AccountUI, h = React.createElement, D = window.FMSCData;

  /* SAMPLE DATA (Figma): Grace Church Youth Group as Sarah, an admin, sees it. */
  var GROUP = 'Grace Church Youth Group';
  var shifts = [
    { date: 'Oct. 3, 2026', day: 'Saturday, 9 a.m.', long: 'Saturday, Oct. 3, 2026', time: '9 a.m.', site: 'FMSC Coon Rapids', city: 'Coon Rapids, MN', open: '4 open', claimed: '8 claimed', role: 'Packing', href: 'event-upcoming.html?res=sample' },
    { date: 'Nov. 14, 2026', day: 'Saturday, 1 p.m.', long: 'Saturday, Nov. 14, 2026', time: '1 p.m.', site: 'FMSC Chanhassen', city: 'Chanhassen, MN', open: '8 open', claimed: '2 claimed', role: 'Organizing', href: '#' },
    { date: 'Jan. 9, 2027', day: 'Saturday, 9 a.m.', long: 'Saturday, Jan. 9, 2027', time: '9 a.m.', site: 'Hope Church MobilePack™ event', city: 'Eagan, MN', open: '19 open', claimed: '1 claimed', role: 'Packing', href: '#' }
  ];
  var you = D.profile.display('Sarah Whitfield');
  var roster = [
    { name: you, role: 'Admin · you', next: 'Oct. 3', consent: '—', phone: D.profile.fieldOr('phone', '612-555-0187'), email: D.profile.primaryEmail() },
    { name: 'Dana Reyes', role: 'Admin', next: 'Nov. 14', consent: '—', contact: 'd.reyes@gracechurch.org' },
    { name: 'Tom Whitfield', role: 'Member', next: 'Oct. 3', consent: '—', phone: '612-555-0146', email: 'tom.whitfield@gmail.com', action: 'Remove' },
    { name: 'Maya Whitfield', role: 'Under 18 · your child', next: 'Oct. 3', consent: 'Signed', consentNote: 'by ' + you, contact: 'Through ' + D.profile.firstName() + '’s account',
      mContact: 'Contact through ' + D.profile.firstName() + '’s account', mConsent: 'Signed by ' + you, action: 'Remove' },
    { name: 'Caleb Okafor', role: 'Under 18 · guest', next: 'Oct. 3', consent: 'Waiting on guardian', consentNote: 'Sent to Grace Okafor, Sept. 20', contact: 'Not shared',
      mContact: 'Contact not shared', mConsent: 'Waiting on guardian · Sent to Grace Okafor, Sept. 20', action: 'Resend request' }
  ];
  var totals = [['Meals packed together', '48,600'], ['Hours on the line', '24'], ['Shifts since 2024', '12'], ['Countries the food reached', '4']];
  var where = [['Haiti', '18,200 meals'], ['Philippines', '14,900 meals'], ['Nicaragua', '9,700 meals'], ['Guatemala', '5,800 meals']];

  /* True when the element is narrower than px: the tables switch to stacked records rather than squeezing columns. */
  function useNarrow(ref, px) {
    var st = React.useState(false), narrow = st[0], setNarrow = st[1];
    React.useLayoutEffect(function () {
      var el = ref.current; if (!el || !window.ResizeObserver) return undefined;
      var ro = new ResizeObserver(function (en) { setNarrow(en[0].contentRect.width < px); });
      ro.observe(el); return function () { ro.disconnect(); };
    }, [px]);
    return narrow;
  }

  /* Stacked records — the DS Data table Mobile layout (same classes and roles), built here because Figma gives some
     records a link, some a button and some no action, and the DS sets the action type per column. */
  function Records(p) {
    return h('div', { className: 'fm-dtable fm-dtable--mobile fm-mobile' },
      h('div', { role: 'table', 'aria-label': p.caption, className: 'fm-dtable__records' },
        h('div', { role: 'rowgroup', className: 'fm-visually-hidden' },
          h('div', { role: 'row' }, p.labels.map(function (l, i) { return h('span', { key: i, role: 'columnheader' }, l); }))),
        h('div', { role: 'rowgroup' }, p.records.map(function (r, ri) {
          return h('div', { key: ri, role: 'row', className: 'fm-dtable__record' },
            r.lines.map(function (t, li) {
              return h('div', { key: li, className: 'fm-dtable__line ' + (li ? 'fm-dtable__detail body-small' : 'fm-dtable__primary label-small') }, h('span', { role: 'cell' }, t));
            }),
            r.link ? h('div', { role: 'cell', className: 'fm-dtable__link-wrap' }, h('a', { className: 'fm-dtable__link body-small fm-focusable', href: r.link.href || '#' }, r.link.label)) : null,
            r.button ? h('div', { role: 'cell' }, h(F.Button, { variant: 'secondary', size: 'medium', type: 'button' }, r.button)) : null);
        }))),
      h(F.Pagination, { count: p.count, ariaLabel: p.pagerLabel }));
  }

  function Head(p) {
    var mobile = F.useIsMobile();
    var title = h('h2', { className: 'ac-card__title ' + (mobile ? 'heading-h4-mobile' : 'heading-h4'), id: p.id }, p.title);
    return h('div', { className: 'ac-card__header gp-head' + (p.pad ? ' gp-head--pad' : '') },
      h(UI.Badge, { icon: p.icon }),
      p.sub ? h('div', { className: 'gp-heading' }, title, p.sub) : title,
      mobile ? null : p.action);
  }

  function Rows(p) {
    return h('dl', { className: 'gp-rows' }, p.rows.map(function (r) {
      return h('div', { key: r[0], className: 'gp-row' }, h('dt', { className: 'body-small' }, r[0]), h('dd', { className: 'label-small' }, r[1]));
    }));
  }

  function GroupAdmin() {
    var mobile = F.useIsMobile();
    var h4 = mobile ? 'heading-h4-mobile' : 'heading-h4';
    var shiftsRef = React.useRef(null), rosterRef = React.useRef(null);
    var shiftsStacked = useNarrow(shiftsRef, 880) || mobile;
    var rosterStacked = useNarrow(rosterRef, 880) || mobile;
    var q = React.useState(''), query = q[0], setQuery = q[1];
    var needle = query.trim().toLowerCase();
    var people = roster.filter(function (r) { return !needle || r.name.toLowerCase().indexOf(needle) >= 0; });
    var noMatch = null; /* No no-match message: Figma has none. */

    var shiftsTable = shiftsStacked
      ? h(Records, { caption: 'Your group’s upcoming shifts', labels: ['Date', 'Time and site', 'Spots', 'Your role', 'Action'], count: '1–3 of 3 shifts', pagerLabel: 'Shift pages',
          records: shifts.map(function (s) {
            return { lines: [s.long, s.time + ' · ' + s.site + ' · ' + s.city, s.open + ' · ' + s.claimed, 'Your role: ' + s.role], link: { label: 'Manage shift', href: s.href } };
          }) })
      : h(F.DataTable, {
          breakpoint: 'desktop', caption: 'Your group’s upcoming shifts', count: '1–3 of 3 shifts', pagination: { ariaLabel: 'Shift pages' },
          /* Figma column widths 170/364/190/100/120 of the 944px table, as shares. */
          columns: [
            { key: 'date', label: 'Date', cells: 'stacked', width: '18%', sort: 'ascending', onSort: function () {} },
            { key: 'site', label: 'Site', cells: 'stacked', width: '38.56%' },
            { key: 'spots', label: 'Spots', cells: 'stacked', width: '20.13%' },
            { key: 'role', label: 'Your role', width: '10.59%' },
            { key: 'action', label: 'Action', cells: 'link', width: '12.72%', header: { showLabel: false } }
          ],
          rows: shifts.map(function (s) {
            return { date: { value: s.date, secondary: s.day }, site: { value: s.site, secondary: s.city }, spots: { value: s.open, secondary: s.claimed }, role: s.role,
              action: { value: h(React.Fragment, null, 'Manage shift', h('span', { className: 'fm-visually-hidden' }, ' for ' + s.date)), href: s.href } };
          })
        });

    var rosterTable = rosterStacked
      ? h(Records, { caption: 'Who’s in your group', labels: ['Name', 'Role', 'Next shift and contact', 'Guardian consent', 'Action'], count: '1–5 of 11 people', pagerLabel: 'Group member pages',
          records: people.map(function (r) {
            var contact = r.mContact || (r.phone ? r.phone + ' · ' + r.email : r.contact);
            var lines = [r.name, r.role, 'Next shift ' + r.next + ' · ' + contact];
            if (r.mConsent) lines.push(r.mConsent);
            return { lines: lines, link: r.action ? { label: r.action, href: '#' } : null };
          }) })
      : h(F.DataTable, {
          breakpoint: 'desktop', caption: 'Who’s in your group', count: '1–5 of 11 people', pagination: { ariaLabel: 'Group member pages' },
          /* Figma column widths 260/100/208/206/170 of the 944px table, as shares. */
          columns: [
            { key: 'name', label: 'Name', cells: 'stacked', width: '27.54%', sort: 'unsorted', onSort: function () {} },
            { key: 'next', label: 'Next shift', width: '10.59%' },
            { key: 'consent', label: 'Guardian consent', cells: 'stacked', width: '22.03%' },
            { key: 'contact', label: 'Shared contact', cells: 'stacked', width: '21.83%' },
            { key: 'action', label: 'Action', cells: 'link', width: '18.01%', header: { showLabel: false } }
          ],
          rows: people.map(function (r) {
            return {
              name: { value: r.name, secondary: r.role },
              next: r.next,
              consent: r.consentNote ? { value: r.consent, secondary: r.consentNote } : { value: r.consent, type: 'text' },
              contact: r.phone ? { value: r.phone, secondary: h('a', { className: 'fm-focusable', href: 'mailto:' + r.email }, r.email) } : { value: r.contact, type: 'text' },
              action: r.action ? { value: h(React.Fragment, null, r.action, h('span', { className: 'fm-visually-hidden' }, ' for ' + r.name)), href: '#' } : { value: '', type: 'text' }
            };
          })
        });

    var inviteStatus = h('p', { className: 'body-small gp-muted' }, 'Anyone you invite joins ' + GROUP + ' and can claim spots on its shifts.');
    var bookBtn = h(F.Button, { variant: 'primary', size: 'medium', href: 'signup-1.html?path=b' }, 'Book a group shift');

    return h(window.AccountShell, { current: 'people' },

      h(F.AccountPageHeader, {
        breakpoint: 'auto', title: GROUP, showBreadcrumb: true,
        breadcrumb: [{ label: 'My account', href: 'account-dashboard.html' }, { label: 'People & groups', href: 'account-people.html' }, { label: GROUP }],
        backTo: { label: 'People & groups', href: 'account-people.html' },
        showDescription: true, description: 'Church: Youth Over 12 · 9 people · You’re an admin',
        showAction: true, actionLabel: 'Group settings', actionHref: 'account-group-settings.html'
      }),

      /* 1 · Your group's upcoming shifts */
      h('section', { className: 'ac-card gp-card', 'aria-labelledby': 'gp-shifts-title' },
        h(Head, { icon: 'calendar', title: 'Your group’s upcoming shifts', id: 'gp-shifts-title', action: bookBtn }),
        mobile ? bookBtn : null,
        h('div', { className: 'gp-table', ref: shiftsRef }, shiftsTable)),

      /* 2 · Who's in your group */
      h('section', { className: 'ac-card gp-card', 'aria-labelledby': 'gp-roster-title' },
        h(Head, { icon: 'users-group', title: 'Who’s in your group', id: 'gp-roster-title' }),
        h('div', { className: 'gp-search' }, h(F.Search, { label: 'Find someone in your group', placeholder: 'Find someone in your group', value: query,
          onChange: function (e) { setQuery(e.target.value); }, onClear: function () { setQuery(''); } })),
        h('div', { className: 'gp-table', ref: rosterRef }, noMatch || rosterTable),
        h('div', { className: 'gp-foot' },
          h('p', { className: 'caption gp-muted' }, 'Only a guardian can give consent for a volunteer under 18. We email them a link to sign.'),
          h(F.Button, { variant: 'secondary', size: 'medium', type: 'button' }, 'Leave this group'))),

      /* 2b · Invite people to your group (Figma Invite, Guest tab = On, Tab = Link) */
      h('section', { className: 'ac-card gp-card gp-invite', 'aria-labelledby': 'gp-invite-title' },
        h(Head, { icon: 'user-plus', title: 'Invite people to your group', id: 'gp-invite-title', pad: true, sub: mobile ? null : inviteStatus }),
        /* Figma mobile moves the status line under the header. */
        mobile ? inviteStatus : null,
        h(F.Invite, {
          breakpoint: 'auto', guestTab: true, defaultTab: 'link',
          linkLabel: 'Group link', linkUrl: 'fmsc.org/join/grace-4821', showLinkNote: false,
          codeIntro: 'Joining on fmsc.org? Use this code:', code: 'GRACE-4821',
          showSettingsLink: true, settingsHref: 'account-group-settings.html',
          emailDescription: 'They get an email invitation to join ' + GROUP + '.',
          guestWhy: 'For someone without an email address. You claim the spot for them.'
        })),

      /* 3 · What your group has packed */
      h('section', { className: 'ac-card gp-card', 'aria-labelledby': 'gp-packed-title' },
        h(Head, { icon: 'bowl', title: 'What your group has packed', id: 'gp-packed-title', pad: true }),
        h('div', { className: 'gp-two' },
          h('div', { className: 'gp-list' }, h('h3', { className: 'label-small' }, 'Your group’s totals'), h(Rows, { rows: totals })),
          h('div', { className: 'gp-two__rule', 'aria-hidden': 'true' }),
          h('div', { className: 'gp-list' }, h('h3', { className: 'label-small' }, 'Where your group’s food went'), h(Rows, { rows: where }))),
        h('div', { className: 'gp-actions' }, h(F.Button, { variant: 'secondary', size: 'medium', type: 'button' }, 'Share these numbers'))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(GroupAdmin));
</script>
</body>
</html>
