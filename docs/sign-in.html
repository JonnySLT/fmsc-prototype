<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · FMSC</title>
<meta name="description" content="Sign in page for the FMSC.org usability test, built from the FMSC Design System.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; components bring their own styles. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, p, ul { margin: 0; }
  .au-link { color: var(--content-link); text-decoration: none; }
  .au-link:hover { text-decoration: underline; }

  /* "Main": photo panel (618) | form column (822). The form comes first in the DOM (h1 first); the grid puts the panel left. */
  .au-main { display: grid; grid-template-columns: 618fr 822fr; }
  .au-panel { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--item-y);
    padding: var(--section-y) var(--space-2xl) var(--section-y) var(--space-container-x); background: var(--background-brand-subtle); }
  .au-formcol { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-lg);
    padding: var(--section-y) var(--space-container-x) var(--section-y) var(--space-2xl); min-width: 0; }

  /* Sign-in card: canvas fill, default border, 16 radius */
  .au-card { width: 100%; max-width: 588px; display: flex; flex-direction: column; gap: var(--space-lg); padding: var(--card-pad);
    background: var(--background-canvas); border: 1px solid var(--border-default); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); }
  .au-card__body { display: flex; flex-direction: column; gap: var(--space-lg); }
  .au-fields { display: flex; flex-direction: column; gap: var(--space-md); }
  .au-fields .fm-input { width: 100%; }
  .au-remember { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap; }
  .au-card__foot { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-md); }
  .au-social { display: flex; gap: var(--space-sm); width: 100%; }
  .au-social > * { flex: 1 1 0; min-width: 0; }
  .au-trouble { display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap; }

  /* Photo collage: four tilted photo cards; positions are the Figma group's, in % so it scales with the column */
  .au-collage { position: relative; width: 100%; max-width: 384px; aspect-ratio: 384 / 314; flex: none; }
  .au-collage--m { max-width: 361px; aspect-ratio: 361 / 193; }
  .au-photo { position: absolute; transform-origin: 0 0; overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  .au-photo img { width: 100%; height: 100%; object-fit: cover; }
  /* Figma: 5.47px inside stroke in background/surface */
  .au-photo::after { content: ''; position: absolute; inset: 0; border: 5.5px solid var(--background-surface); border-radius: inherit; pointer-events: none; }
  .au-panel__content { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-md); width: 100%; max-width: 384px; }
  .au-panel__content p.body-small { color: var(--content-secondary); }
  .au-panel__content p.caption { color: var(--content-secondary); }
  .au-secondary { color: var(--content-secondary); }

  /* 600–879: desktop design stacked (form, then panel), hamburger nav */
  @media (max-width: 879.98px) {
    .au-main { grid-template-columns: 1fr; }
    .au-formcol { grid-column: 1; grid-row: 1; align-items: center; padding: var(--section-y) var(--space-2xl); }
    .au-panel { grid-column: 1; grid-row: 2; align-items: center; padding: var(--section-y) var(--space-2xl); }
    .au-panel > * { width: 100%; max-width: 588px; }
    .au-panel .au-collage { max-width: 384px; align-self: center; }
  }
  /* < 600: the "Mobile/Account/Sign in" frame */
  @media (max-width: 599.98px) {
    .au-formcol { padding: var(--section-y) var(--margin-x); }
    .au-panel { align-items: flex-start; gap: var(--space-lg); padding: var(--section-y) var(--margin-x); }
    .au-panel > * { max-width: none; }
    .au-panel .au-collage { max-width: 361px; align-self: flex-start; }
    .au-social { flex-direction: column; }
    .au-social > * { flex: none; }
    .au-card__foot > .fm-btn { width: 100%; }
    /* Footer: DS mobile columns keep the desktop 140px flex-basis, which becomes height in the column stack */
    .au-page .fm-footer--mobile .fm-footer__col, .au-page .fm-footer--mobile .fm-footer__brand { flex: none; }
  }
  /* Footer: the frame's legal line runs on one line beside the seals (DS caps it at 756px) */
  .au-page .fm-footer--desktop .fm-footer__legal-copy { max-width: none; }
</style>
</head>
<body class="au-page">
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="flow-data.js"></script>
<script>
  var F = window.FMSC, h = React.createElement, Fragment = React.Fragment;
  var img = function (n) { return 'img/' + n; };
  function inert(e) { e.preventDefault(); }

  /* Collage cards: [image, alt, x, y, w, h, CSS rotation] in the Figma group's px (desktop 384 × 314, mobile 361 × 193).
     Figma rotation is counter-clockwise, so CSS rotate is its negative; both rotate about the card's top-left. */
  var COLLAGE = {
    w: 384, h: 314, cards: [
      ['auth-packing-crowd.jpg', 'Volunteers in hairnets packing meals at long tables in a busy hall', 196.7, 0, 155.1, 153.2, 3.12],
      ['auth-plane-volunteers.jpg', 'Three volunteers sitting in an aircraft doorway holding a MannaPack® box', 9.4, 36.8, 195.8, 139.9, 4.16],
      ['auth-volunteer-hairnet.jpg', 'A smiling volunteer in a hairnet at a packing event', 28.8, 141.3, 155.1, 153.2, 3.12],
      ['auth-kids-meal.jpg', 'Children smiling over bowls of food at a table', 161.5, 152.6, 214.6, 161.6, -3.12]
    ] };
  var COLLAGE_M = {
    w: 361, h: 193, cards: [
      ['auth-m-volunteer-hairnet.jpg', 'A smiling volunteer in a hairnet at a packing event', 15.8, 4, 188, 172, 4],
      ['auth-kids-meal.jpg', 'Children smiling over bowls of food at a table', 153.8, 22, 195, 163, -3]
    ] };
  function pct(v, of) { return (v / of * 100) + '%'; }
  function Collage(p) {
    var c = p.data;
    return h('div', { className: 'au-collage' + (p.mobile ? ' au-collage--m' : '') },
      c.cards.map(function (k) {
        return h('div', { key: k[0], className: 'au-photo', style: { left: pct(k[2], c.w), top: pct(k[3], c.h), width: pct(k[4], c.w), height: pct(k[5], c.h), transform: 'rotate(' + k[6] + 'deg)' } },
          h('img', { src: img(k[0]), alt: k[1] }));
      }));
  }

  /* Google mark: the Figma Social sign-in button draws the outlined "brand-google" glyph, which the DS icon set lacks
     (DS renders a placeholder circle). Same stroke style as the DS icons. */
  var GOOGLE_MARK = h('svg', { width: 24, height: 24, viewBox: '0 0 24 24', fill: 'none', 'aria-hidden': 'true' },
    h('path', { d: 'M20.945 11a9 9 0 1 1 -3.284 -5.997l-2.655 2.392a5.5 5.5 0 1 0 2.119 6.605h-4.125v-3h7.945z', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }));

  function signIn(e) { if (e) e.preventDefault(); window.FMSCAuth.signIn(); window.FMSCAuth.go('account-dashboard.html'); }

  function SignInPage() {
    var mobile = F.useIsMobile();
    return h(Fragment, null,
      h(window.SiteNav, {}),
      h('main', { className: 'au-main' },
        /* 1 · Sign-in form */
        h('section', { className: 'au-formcol', 'aria-labelledby': 'au-title' },
          h('form', { className: 'au-card', onSubmit: signIn, noValidate: true },
            h('div', { className: 'au-card__body' },
              h('h1', { id: 'au-title', className: mobile ? 'heading-h2-mobile' : 'heading-h2' }, 'Sign in to FMSC'),
              h('div', { className: 'au-fields' },
                h(F.Input, { id: 'au-email', name: 'email', label: 'Email', type: 'email', autoComplete: 'email' }),
                h(F.Input, { id: 'au-password', name: 'password', label: 'Password', type: 'password', autoComplete: 'current-password' })),
              h('div', { className: 'au-remember' },
                h(F.Checkbox, { name: 'remember', label: 'Keep me signed in' }),
                h('a', { className: 'au-link body-small', href: '#', onClick: inert }, 'Forgot password?'))),
            h('div', { className: 'au-card__foot' },
              h(F.Button, { variant: 'primary', size: 'large', type: 'submit', label: 'Sign in', fullWidth: mobile }),
              h(F.Divider, { label: 'or' }),
              h('div', { className: 'au-social' },
                h(F.SocialSignInButton, { provider: 'google', mark: GOOGLE_MARK, type: 'button', fullWidth: true, label: mobile ? 'Continue with Google' : 'Google', onClick: signIn }),
                h(F.SocialSignInButton, { provider: 'facebook', type: 'button', fullWidth: true, label: mobile ? 'Continue with Facebook' : 'Facebook', onClick: signIn })),
              h('div', { className: 'au-trouble' },
                h('p', { className: 'body-small' }, 'Trouble signing in?'),
                h('a', { className: 'au-link body-small', href: '#', onClick: inert }, 'Contact us'))))),

        /* 2 · New to FMSC — photo panel */
        h('section', { className: 'au-panel', 'aria-labelledby': 'au-new' },
          h(Collage, { data: mobile ? COLLAGE_M : COLLAGE, mobile: mobile }),
          h('div', { className: 'au-panel__content' },
            h('h2', { id: 'au-new', className: mobile ? 'heading-h4-mobile' : 'heading-h4' }, 'New to FMSC?'),
            h('p', { className: 'body-small' }, 'You’ll need an account to reserve a packing shift. It also keeps your hours and receipts in one place.'),
            h(F.Button, { variant: 'secondary', size: 'medium', href: 'create-account.html', label: 'Create an account', fullWidth: mobile }),
            h('p', { className: 'caption' }, 'Came with a group? That didn’t make an account for you.')))),

      h(F.Footer, { breakpoint: 'auto',
        logoSrc: img('fmsc-logo-text-only.png'),
        columns: [
          { title: 'About FMSC', links: [{ label: 'Our mission', href: 'mission.html' }, 'Our story', 'What’s in a meal', 'Locations', 'Our finances', 'Leadership and board', 'Careers', 'News', 'Contact us'] },
          { title: 'Ways to help', links: [{ label: 'Volunteer at a packing event', href: 'volunteer.html' }, { label: 'Donate once or monthly', href: 'donate.html' }, { label: 'Start a fundraiser', href: 'fundraiser.html' }, { label: 'Shop FMSC MarketPlace™', href: 'marketplace.html' }, { label: 'Host an FMSC MobilePack™ event', href: 'host-mobilepack.html' }, { label: 'Attend a fundraising event', href: 'fundraising-events.html' }, { label: 'Plan an estate gift', href: 'estate-gift.html' }, { label: 'Corporate partnerships', href: 'corporate-partnerships.html' }] },
          { title: 'Resources', links: ['Common questions', 'Annual report', 'Food aid requests', 'Request a speaker', 'Partner resources', 'Press'] },
          { title: 'Account', links: [{ label: 'Sign in', href: 'sign-in.html' }, { label: 'Your impact', href: 'account-dashboard.html' }, { label: 'Receipts and tax documents', href: 'account-giving.html' }] },
          { title: 'Stay in touch', links: ['Email updates', 'Facebook', 'Instagram', 'YouTube', 'LinkedIn'] }
        ],
        seals: [img('seal-charity-navigator.png'), img('seal-candid.svg')]
      }));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(SignInPage));
</script>
</body>
</html>
