<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You’re signed up · FMSC</title>
<meta name="description" content="Your packing spot at FMSC Coon Rapids is reserved for Saturday, Oct. 3, 9–11 a.m.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; the flow shell and shared blocks (su-) come from signup-shell.js. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="flow-data.js"></script>
<script src="signup-shell.js"></script>
<script>
  var F = window.FMSC, UI = window.SignupUI, Shell = window.SignupShell, h = React.createElement;
  /* Path A · confirmation (Figma "Sign up — A4 Confirmation"). "See your reservation" opens the event details page. */
  /* Saved to the reservations store as it renders (upsert, so a reload doesn't duplicate); the event page reads it. */
  Shell.flow.saveReservation('a');
  function Page() {
    var r = Shell.flow.resolve('a'); /* date and time from step 1 */
    return h(Shell, { path: 'a', step: 4, summary: false },
      h(UI.Confirmation, { labelledBy: 'sa-confirm-title', path: 'a', summary: { spotsValue: '1 spot' } },
        h('div', { id: 'sa-confirm-title' },
          h(UI.ConfirmTitle, { title: 'You’re signed up for ' + r.dateLabel, body: 'We sent the details to ' + window.FMSCData.profile.primaryEmail() + '. Arrive at ' + r.arrive })),
        h(UI.Rule),
        h(UI.ConfirmLinks, { line: 'Check your details or cancel from your reservation.',
          links: [{ label: 'See your reservation', href: Shell.flow.reservationHref() }, { label: 'Add to calendar', href: '#' }] })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
