<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment · Give meals · FMSC</title>
<meta name="description" content="Pay for your monthly gift to FMSC by card or bank account.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; the flow shell and shared blocks (gv-) come from give-shell.js. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="flow-data.js"></script>
<script src="give-shell.js"></script>
<script>
  var F = window.FMSC, UI = window.GiveUI, Shell = window.GiveShell, h = React.createElement;
  /* Flow A · step 3 (Figma "Give — A3 Payment"): monthly gift.
     Give and the wallet buttons → confirmation. */
  function Page() {
    var st = Shell.useGift('a'), g = st[0], set = st[1];
    /* Desktop: the monthly note repeats under the summary card (Figma A3 Aside). */
    var note = g.freq === 'monthly' ? 'Charged today, then monthly on the same date. You can change or stop your monthly gift anytime.' : null;
    return h(Shell, { summary: Shell.summary(g, { step: 3 }), asideNote: note, faq: true },
      h(UI.Steps, null,
        h(UI.DoneStep, { number: 1, title: 'Your gift', answer: Shell.giftAnswer(g), href: Shell.giftHref(g) }),
        h(UI.DoneStep, { number: 2, title: 'Your details', answer: Shell.detailsAnswer('sarah'), answerMobile: Shell.detailsAnswer('sarah', true), href: 'give-a2.html' }),
        h(UI.StepCard, { number: 3, title: 'Payment', className: 'gv-pay' },
          h(UI.Payment, { gift: g, onChange: set, giveHref: Shell.confirmHref(g) }))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>
