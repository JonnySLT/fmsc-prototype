<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your spots are reserved · Sign up your group · FMSC</title>
<meta name="description" content="Spots for Faith Lutheran Confirmation Class at FMSC Coon Rapids are reserved. Fill your spots and share the link with the rest of your group.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; the flow shell, the people list and the shared blocks (su-, pp-)
     come from signup-shell.js and people-picker.js. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="flow-data.js"></script>
<script src="people-picker.js"></script>
<script src="signup-shell.js"></script>
<script>
  var UI = window.SignupUI, Shell = window.SignupShell, h = React.createElement, D = window.FMSCData;
  /* Path D · confirmation (Figma "Sign up — D4 Confirmation"): spots reserved for the new Faith Lutheran Confirmation
     Class; fill them from the four people on Sarah's account (the new group has no members yet).
     Figma (Oct. 27, 2026): checking a person claims a spot (Added toast), unchecking frees it (Removed toast); "Add someone"
     adds a person by name; "Share a link" sits under the reservation summary. "See your reservation" opens the event page. */
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(Shell, { path: 'd', step: 4, summary: false },
      h(UI.ConfirmPeople, { path: 'd', people: D.people.account, fromLabel: 'From people on your account',
        searchLabel: 'Find someone on your account', addTitle: 'Someone else coming? Add them' })));
</script>
</body>
</html>
