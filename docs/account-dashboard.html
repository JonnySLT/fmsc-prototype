<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · FMSC</title>
<meta name="description" content="Your FMSC account dashboard: meals you’ve packed and funded, your next packing shift, your giving and where your meals have gone.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; shared account styles (ac-) come from account-shell.js. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }

  /* Two cards side by side; one column when the content column is under 800px (1024 and down). */
  .ad-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-lg); align-items: stretch; }
  .ad-pair--impact { gap: var(--grid-gap); }
  /* Stacking point for the pairs: see the end of this block. */

  /* 1 · Your impact so far — Figma figures: label Body/Base, value Label/Base */
  /* Figma overrides these values to Inter Bold (700) at both breakpoints. The DS font import stops at Inter 600, so
     this renders as 600 until the DS adds 700 (DS limitation, reported). */
  .ad-impact .ac-row__value { font-weight: 700; }

  /* Your next packing shift */
  .ad-when { display: flex; flex-direction: column; gap: var(--space-2xs); }
  .ad-muted { color: var(--content-secondary); }
  .ad-map { position: relative; overflow: hidden; aspect-ratio: 436 / 197; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); background: var(--background-subtle); }
  .ad-map picture { display: contents; }
  .ad-map img { width: 100%; height: 100%; object-fit: cover; }
  /* Figma pins the map-pin 1px right of and 6px above the map centre (7.5px left of it on mobile). */
  .ad-map__pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: calc(-1 * (var(--space-xs) - var(--space-3xs))) 0 0 1px; color: var(--brand-primary); }
  /* Figma's arrow links hug their label; don't stretch them across the card. */
  .ac-card > .fm-arrow-link, .ad-shift > .fm-arrow-link { align-self: flex-start; }

  /* Needs your attention: copy wraps at the Figma 221px measure, button right */
  .ad-todo__text { max-width: 221px; }
  .ad-todo .fm-btn { flex: none; }

  /* Where your meals have gone: country in primary, meals in secondary. Figma spaces the middle rows wider. */
  .ad-country .ac-row__label { color: var(--content-primary); }
  .ad-country .ac-row__value { color: var(--content-secondary); text-align: right; }
  .ac-row.ad-country--wide { padding: var(--space-lg) 0; }

  /* Your giving this year */
  .ad-give__value { display: inline-flex; align-items: baseline; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-2xs); color: var(--content-primary); }
  /* Inline "change" links: hit area extended to 48px without moving the row. */
  .ad-give__value a { display: inline-block; padding: var(--space-sm) 0; margin: calc(-1 * var(--space-sm)) 0; color: var(--content-link); text-decoration: none; }
  .ad-give__value a:hover { text-decoration: underline; }
  .ad-give-actions { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap; }
  .ad-statement { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2xs); }
  .ad-statement p { color: var(--content-secondary); text-align: right; }

  /* Recent events */
  .ad-shifts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--grid-gap); align-items: start; }
  @container ac-content (max-width: 599.98px) { .ad-shifts { grid-template-columns: minmax(0, 1fr); } }
  .ad-shift { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-sm); min-width: 0; }
  .ad-shot { position: relative; width: 100%; aspect-ratio: 2 / 1; overflow: hidden; border-radius: var(--radius-md); }
  /* Full 3:2 photos, centre-cropped like Figma's FILL at both 2:1 (desktop) and 327 x 180 (mobile). */
  .ad-shot img { width: 100%; height: 100%; object-fit: cover; }
  /* Figma crops the June 7 photo to its full width and top 75% (CROP fill), stretched to the frame: the full photo
     (ad-shift-eagan-full.jpg, 3:2) is drawn 4/3 of the frame tall from the top (exact at 2:1, stretched like Figma at 327 x 180). */
  .ad-shot--top img { height: calc(100% * 4 / 3); object-fit: fill; }
  /* Figma pins the photo-count pill at y = 110 in the image at both breakpoints (12px from the bottom of the 150px
     desktop image, 42px from the bottom of the 180px mobile one). */
  .ad-count { position: absolute; left: var(--space-sm); top: 110px; padding: var(--space-2xs) var(--space-sm); border-radius: var(--radius-pill); background: var(--background-inverse); color: var(--content-on-brand); }
  .ad-copy { display: flex; flex-direction: column; gap: var(--space-sm); align-self: stretch; }
  .ad-facts { display: flex; flex-direction: column; gap: var(--space-2xs); }

  /* One column when the content column is under 800px (1024 and down). */
  @container ac-content (max-width: 799.98px) {
    .ad-pair { grid-template-columns: minmax(0, 1fr); }
    /* Stacked: keep the map a strip and the country list evenly spaced (the wide rows only balance the desktop pair). */
    .ad-map { aspect-ratio: 3 / 1; }
    .ac-row.ad-country--wide { padding: var(--space-sm) 0; }
  }

  /* Mobile frame (393): below 600px */
  @media (max-width: 599.98px) {
    /* Figma: dashboard mobile card headers have no padding under them (other account pages keep 12px). */
    body .ac-card__header { padding-bottom: 0; }
    .ad-pair { grid-template-columns: minmax(0, 1fr); gap: var(--section-gap); }
    .ad-pair--impact { gap: var(--grid-gap); }
    /* Figma mobile lists "What you've given" before "What you've packed". */
    .ad-impact__given { order: -1; }
    /* Figma mobile fixes the shift body at 244, leaving 8px under the 140px map before the link. */
    .ad-map { aspect-ratio: 327 / 140; margin-bottom: var(--space-xs); }
    .ad-map__pin { margin: 0 0 0 -7.5px; }
    .ac-row.ad-todo { flex-direction: column; align-items: stretch; }
    .ad-todo__text { max-width: none; }
    .ad-todo .fm-btn { width: 100%; }
    .ac-row.ad-country--wide { padding: var(--space-sm) 0; }
    .ad-give-actions { flex-direction: column; align-items: center; gap: var(--space-sm); }
    .ad-statement { align-self: stretch; align-items: center; }
    .ad-statement .fm-btn { width: 100%; }
    .ad-statement p { text-align: center; }
    .ad-shot { aspect-ratio: 327 / 180; }
    /* Figma mobile keeps this card header at 40px; the two-line title overhangs it 4px above and below. */
    .ad-past .ac-card__title { margin: calc(-1 * var(--space-2xs)) 0; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="ds/bundle.js"></script>
<script src="site-nav.js"></script>
<script src="account-shell.js"></script>
<script src="flow-data.js"></script>
<script>
  var F = window.FMSC, UI = window.AccountUI, h = React.createElement;
  var img = function (n) { return 'img/' + n; };

  /* SAMPLE DATA (Figma): the usability-test persona Sarah's figures, dates and places. */
  var packed = [['Meals packed in person', '1,240'], ['Across 6 shifts', '12 hours'], ['Countries reached', '5']];
  var given = [['Meals funded by your giving', '6,352'], ['Lifetime giving', '$1,842'], ['FMSC MarketPlace™', '$164']];
  /* Your next packing shift: the earliest upcoming of the shifts saved in the sign-up flow and the Figma sample
     (Oct. 3, Coon Rapids, with Grace Church Youth Group); a saved shift wins a tie. "Today" is Sept. 1, 2026. */
  var RS = window.FMSCData.reservations;
  var next = (function () {
    var all = [RS.SAMPLE].concat(RS.list()).map(function (r) { return { r: r, d: RS.describe(r) }; })
      .filter(function (x) { return x.d.upcoming; });
    all.sort(function (a, b) { return a.d.days - b.d.days || (a.r.sample ? 1 : 0) - (b.r.sample ? 1 : 0); });
    var x = all[0] || { r: RS.SAMPLE, d: RS.describe(RS.SAMPLE) };
    return { date: x.d.dateShort, city: x.d.site.city, where: x.d.site.where, when: 'Arrive ' + x.d.arrive + ' · packing ' + x.r.time,
      href: 'event-upcoming.html?res=' + encodeURIComponent(x.r.id) };
  })();
  var todos = [
    /* Check in (Figma layer "Button · Sign your waiver") opens the event's day-of page. */
    ['It’s time to check in for your next shift.', 'Check in', 'event-day-of.html'],
    /* The group's upcoming shift (event-upcoming shows the latest saved reservation, else the Figma sample). */
    ['Your group has 4 spots unfilled for Saturday.', 'Add spots', 'event-upcoming.html'],
    ['The card for your monthly gift expires next month.', 'Update your card', 'account-giving.html'],
    ['Confirm your address so past gifts match to you.', 'Confirm your details', 'account-profile.html']
  ];
  var countries = [['Haiti', '430 meals'], ['Philippines', '310 meals'], ['Guatemala', '240 meals'], ['Burkina Faso', '160 meals'], ['Nicaragua', '100 meals']];
  var shifts = [
    { shift: '2026-08-08', src: 'ad-shift-coon-rapids-full.jpg', alt: 'Volunteers in hairnets packing meals at a long table at FMSC Coon Rapids', count: '24 photos', eyebrow: 'Aug. 8 · FMSC Coon Rapids', headline: '32,400 meals packed', outcome: 'Arrived in Haiti on Sept. 2', support: 'Will feed 88 children for a year' },
    { shift: '2026-06-07', top: true, src: 'ad-shift-eagan-full.jpg', alt: 'Two boys in hairnets smiling beside a box of MannaPack® meals, one holding a sealed meal bag', count: '11 photos', eyebrow: 'June 7 · Hope Church MobilePack™ event, Eagan, MN', headline: '62,784 meals packed', outcome: 'Arrived in the Philippines on July 19', support: 'Will feed 172 children for a year' },
    { shift: '2026-02-22', src: 'ad-shift-chanhassen-full.jpg', alt: 'A smiling girl in a hairnet leaning on a packing table', count: '38 photos', eyebrow: 'Feb. 22 · FMSC Chanhassen', headline: '25,920 meals packed', outcome: 'Arrived in Nicaragua on April 9', support: 'Will feed 71 children for a year' }
  ];
  /* 6 · Your recent MarketPlace purchases (Figma, Oct. 27, 2026): product photos from fmscmarketplace.org. */
  var purchases = [
    { src: 'mp-order-bernide-mug.jpg', alt: 'Bernide Mug – Peace, a ceramic mug made in Haiti', eyebrow: 'Oct. 18 · Made in Haiti', headline: 'Bernide Mug – Peace', outcome: '$32', support: 'Provides 49 meals' },
    { src: 'mp-order-beaded-serving-set.jpg', alt: 'Christmas Beaded Serving Set, beaded serving utensils made in Eswatini', eyebrow: 'Sept. 26 · Made in Eswatini', headline: 'Christmas Beaded Serving Set', outcome: '$34', support: 'Provides 52 meals' },
    { src: 'mp-order-horn-catch-all.jpg', alt: 'Horn Catch All, a small horn dish made in Haiti', eyebrow: 'Aug. 30 · Made in Haiti', headline: 'Horn Catch All', outcome: '$24', support: 'Provides 33 meals' }
  ];

  function statRows(rows) {
    return h('div', { className: 'ac-rows' }, rows.map(function (r) { return h(UI.Row, { key: r[0], label: r[0], value: r[1], valueClass: 'label-base' }); }));
  }

  function Dashboard() {
    return h(window.AccountShell, { current: 'dashboard' },

      /* 1 · Your impact so far */
      h(UI.Panel, { className: 'ad-impact', title: window.FMSCData.profile.firstName() + ', here’s what you’ve made possible' },
        h('div', { className: 'ad-pair ad-pair--impact' },
          h(UI.Card, { tone: 'brand', icon: 'salad', title: 'What you’ve packed' }, statRows(packed)),
          h(UI.Card, { tone: 'brand', icon: 'currency-dollar', title: 'What you’ve given', className: 'ad-impact__given' }, statRows(given)))),

      /* 3 · Your next shift + 2 · Needs your attention */
      h('div', { className: 'ad-pair' },
        h(UI.Card, { icon: 'calendar-event', title: 'Your next packing shift' },
          h('div', { className: 'ad-when' },
            h('p', { className: 'label-small' }, next.date),
            h('p', { className: F.useIsMobile() ? 'heading-h4-mobile' : 'heading-h4' }, next.city)),
          h('p', { className: 'body-base ad-muted' }, next.when),
          h('div', { className: 'ad-map' },
            /* Figma mobile draws the street art at 1:1, clipped 16px short of the right edge (ad-map-mobile.svg). */
            h('picture', null,
              h('source', { media: '(max-width: 599.98px)', srcSet: img('ad-map-mobile.svg') }),
              h('img', { src: img('account-map.svg'), alt: 'Map of the area around ' + next.where + ', with a pin on the site' })),
            h(F.Icon, { name: 'map-pin', size: 24, className: 'ad-map__pin' })),
          h(F.ArrowLink, { label: 'See event details', href: next.href })),
        h(UI.Card, { icon: 'list-check', title: 'Needs your attention' },
          h('div', { className: 'ac-rows' },
            todos.map(function (t) {
              return h('div', { key: t[1], className: 'ac-row ad-todo' },
                h('p', { className: 'ac-row__label ad-todo__text body-base' }, t[0]),
                h(F.Button, { variant: 'secondary', size: 'medium', href: t[2] }, t[1]));
            })))),

      /* Where your meals have gone + 5 · Your giving */
      h('div', { className: 'ad-pair' },
        h(UI.Card, { icon: 'world', title: 'Where your meals have gone' },
          h('div', { className: 'ac-rows' },
            countries.map(function (c, i) {
              var wide = i > 0 && i < countries.length - 1;
              return h(UI.Row, { key: c[0], className: 'ad-country' + (wide ? ' ad-country--wide' : ''), label: c[0], value: c[1] });
            })),
          h('p', { className: 'body-small ad-muted' }, 'Counted from your first shift in 2019.')),
        h(UI.Card, { mask: img('donations-recurring.svg'), title: 'Your giving this year' },
          h('div', { className: 'ac-rows ac-rows--tight' },
            h(UI.Row, { className: 'ac-row--rule', label: 'Given in 2026', value: '$348' }),
            h(UI.Row, { className: 'ac-row--rule', label: 'Last gift', value: '$29 on Sept. 1, 2026' }),
            h(UI.Row, { className: 'ac-row--rule', label: 'Recurring gift', value: h('span', { className: 'ad-give__value' }, '$29/month', h('a', { className: 'fm-focusable', href: 'account-giving.html', 'aria-label': 'Change your recurring gift' }, 'change')) }),
            h(UI.Row, { className: 'ac-row--rule', label: 'Next gift', value: h('span', { className: 'ad-give__value' }, 'Oct. 1, 2026', h('a', { className: 'fm-focusable', href: 'account-giving.html', 'aria-label': 'Change your next gift date' }, 'change')) })),
          h('div', { className: 'ad-give-actions' },
            h(F.ArrowLink, { label: 'See details', href: 'account-giving.html' }),
            h('div', { className: 'ad-statement' },
              h(F.Button, { variant: 'secondary', size: 'medium', href: '#' }, 'Download your 2025 statement'),
              h('p', { className: 'caption' }, 'Your 2025 year-end statement is ready.'))))),

      /* 6 · Your recent MarketPlace purchases ("View order" opens the order on fmscmarketplace.org: Figma External link,
         wired in the prototype to MarketPlace purchases) */
      h(UI.Card, { icon: 'shopping-bag', className: 'ad-past', title: 'Your recent MarketPlace purchases' },
        h('ul', { className: 'ad-shifts', role: 'list', style: { listStyle: 'none', margin: 0, paddingLeft: 0 } },
          purchases.map(function (p) {
            return h('li', { key: p.src, className: 'ad-shift' },
              h('div', { className: 'ad-shot' }, h('img', { src: img(p.src), alt: p.alt })),
              h('div', { className: 'ad-copy' },
                h('p', { className: 'overline ad-muted' }, p.eyebrow),
                h('div', { className: 'ad-facts' },
                  h('p', { className: 'body-base' }, p.headline),
                  h('p', { className: 'body-base ad-muted' }, p.outcome),
                  h('p', { className: 'body-base ad-muted' }, p.support))),
              h(F.ArrowLink, { type: 'external', label: 'View order', href: 'account-marketplace.html', 'aria-label': 'View order: ' + p.headline }));
          })),
        h(F.ArrowLink, { label: 'See all your purchases', href: 'account-marketplace.html' })),

      /* 4 · Past shifts and where your meals ended up */
      h(UI.Card, { icon: 'package', className: 'ad-past', title: 'Recent events you packed at, and where the food went' },
        h('ul', { className: 'ad-shifts', role: 'list', style: { listStyle: 'none', margin: 0, paddingLeft: 0 } },
          shifts.map(function (s) {
            return h('li', { key: s.src, className: 'ad-shift' },
              h('div', { className: 'ad-shot' + (s.top ? ' ad-shot--top' : '') },
                h('img', { src: img(s.src), alt: s.alt }),
                h('span', { className: 'ad-count body-small' }, s.count)),
              h('div', { className: 'ad-copy' },
                h('p', { className: 'overline ad-muted' }, s.eyebrow),
                h('div', { className: 'ad-facts' },
                  h('p', { className: 'body-base' }, s.headline),
                  h('p', { className: 'body-base ad-muted' }, s.outcome),
                  h('p', { className: 'body-base ad-muted' }, s.support))),
              h(F.ArrowLink, { label: 'See details', href: 'event-past.html?shift=' + s.shift, 'aria-label': 'See details: ' + s.eyebrow }));
          })),
        h(F.ArrowLink, { label: 'See all your shifts', href: 'account-volunteering.html' })));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Dashboard));
</script>
</body>
</html>
