<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Mission · FMSC</title>
<meta name="description" content="Feed My Starving Children’s mission, meals, locations, finances and leadership, built from the FMSC Design System.">
<link rel="stylesheet" href="ds/tokens.css">
<link rel="stylesheet" href="ds/bundle.css">
<style>
  /* Page layout only. Every value is an FMSC DS token; components bring their own styles. */
  html, body { margin: 0; background: var(--background-canvas); color: var(--content-primary); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4, p { margin: 0; }

  .mi-section { display: flex; flex-direction: column; align-items: center; gap: var(--section-gap); padding: var(--section-y) var(--margin-x); }
  .mi-section--brand { background: var(--background-brand); }
  .mi-section--brand-subtle { background: var(--background-brand-subtle); }
  .mi-inner { width: 100%; max-width: var(--content-width); }
  .mi-header { width: 100%; max-width: 792px; }

  /* Impact this year (brand field) */
  .mi-impact__actions { display: flex; flex-direction: column; align-items: center; gap: var(--space-lg); }
  .mi-impact .fm-stat-block { width: 100%; }

  /* Locations: map + permanent sites */
  .mi-locations { display: grid; grid-template-columns: minmax(0, 796fr) minmax(320px, 380fr); gap: var(--grid-gap); align-items: start; }
  .mi-map { width: 100%; aspect-ratio: 796 / 501; }
  .mi-map__svg { display: block; width: 100%; height: 100%; }
  .mi-map__states path, .mi-map__highlight path { opacity: 0.3; stroke: var(--background-brand-subtle); }
  .mi-map__states path { fill: var(--content-placeholder); }
  .mi-map__highlight path { fill: var(--blue-400); }
  .mi-map__dots circle { fill: var(--background-brand); }
  .mi-sites { display: flex; flex-direction: column; gap: var(--space-lg); padding: var(--card-pad); background: var(--background-surface); border-radius: var(--radius-xl); }
  .mi-sites__eyebrow { color: var(--content-secondary); }
  /* Figma rows are 40 tall (8/16 padding around a 24px line), 8 apart */
  .mi-sites__list { display: flex; flex-direction: column; gap: var(--space-xs); margin: 0; padding: 0; list-style: none; }
  .mi-sites__link { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs); padding: var(--space-xs) var(--space-md); border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--border-subtle); color: var(--content-link); text-decoration: none; }
  .mi-sites__link:hover { background: var(--background-subtle); }
  .mi-sites__link:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
  .mi-sites__more { display: flex; flex-direction: column; }
  .mi-sites__more p { color: var(--content-secondary); }
  .mi-sites__more a { display: inline-flex; align-items: center; padding: var(--space-xs) 0; color: var(--content-link); text-decoration: none; }
  .mi-sites__more a:hover { text-decoration: underline; }
  .mi-sites__more a:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  /* Finances (Section · Stat row, centred header) */
  .mi-finances .fm-section-stat-row__head { width: 100%; }
  .mi-finances .fm-section-stat-row__link { align-self: center; }

  /* Scripture band */
  .mi-scripture { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-md); min-height: 420px; padding: var(--section-y) var(--margin-x); margin: 0; color: var(--content-on-brand); text-align: center; }
  .mi-scripture__photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
  .mi-scripture__scrim { position: absolute; inset: 0; background: var(--scrim-strong); }
  .mi-scripture blockquote, .mi-scripture figcaption { position: relative; max-width: 792px; margin: 0; }

  /* Section header supporting: Figma caps Body/Large at 730px (80ch of Inter renders wider) */
  main .fm-section-header__supporting { max-width: 730px; }

  /* CTA band trust strip: let the three groups share the row instead of fixed 384px each */
  .fm-cta-band--desktop .fm-cta-band__trust { width: 100%; }
  .fm-cta-band--desktop .fm-cta-band__group { flex: 1 1 0; width: auto; min-width: 0; }

  /* CTA band subtext: the desktop frame sets it in content/on-brand, the mobile frame in blue/200 (see the mobile block) */
  main .fm-cta-band__subtext { color: var(--content-on-brand); }

  /* Footer legal: Figma copy runs one line across the row (DS caps it at 756px) */
  .fm-footer--desktop .fm-footer__legal-copy { max-width: none; }

  .mi-nowrap { white-space: nowrap; }

  /* Hero H1: avoid a one-word last line when it wraps (1100–1024) */
  .fm-hero__title { text-wrap: pretty; }
  /* Centred section headings: balance lines instead of leaving one word on the last line */
  main h2 { text-wrap: balance; }

  /* Leadership */
  .mi-leadership { gap: var(--section-gap); }

  @media (max-width: 1000px) {
    .mi-locations { grid-template-columns: minmax(0, 1fr); }
    .mi-map { max-width: 796px; justify-self: center; }
    /* Stacked: site list in two columns so rows don't stretch the full width */
    .mi-sites__list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--grid-gap); row-gap: var(--space-2xs); }
  }

  /* ---- Mobile (< 600px): Figma "Mobile/Mission" 4454:38209 ---- */
  @media (max-width: 599.98px) {
    main .fm-cta-band__subtext { color: var(--blue-200); }
    /* Impact band sits on brand-dark in the mobile frame */
    .mi-impact { background: var(--background-brand-dark); }
    .mi-impact__stats { display: flex; flex-direction: column; gap: var(--grid-gap); }
    .mi-impact__stats .fm-stat { display: flex; width: 100%; }

    /* Locations: no map on mobile; one card with a single-column site list */
    .mi-map { display: none; }
    .mi-sites { gap: var(--space-xs); border-radius: var(--radius-lg); }
    .mi-sites__list { display: flex; flex-direction: column; gap: var(--space-xs); }

    /* Scripture: photo with a brand-dark ramp, then the verse on brand-dark */
    .mi-scripture { display: block; min-height: 0; padding: 0; overflow: visible; }
    .mi-scripture__media { position: relative; width: 100%; aspect-ratio: 393 / 260; overflow: hidden; }
    .mi-scripture__media .mi-scripture__photo { object-position: 50% 50%; }
    .mi-scripture__ramp { position: absolute; left: 0; right: 0; bottom: 0; height: var(--space-4xl);
      background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--background-brand-dark) 75%, transparent) 60%, var(--background-brand-dark) 100%); }
    .mi-scripture__copy { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); padding: var(--section-y) var(--margin-x); background: var(--background-brand-dark); }


    /* DS fix: mobile footer brand + columns inherit flex-basis 260px / 140px, which becomes height in the stacked column */
    .fm-footer--mobile .fm-footer__col, .fm-footer--mobile .fm-footer__brand { flex: none; }
  }
</style>
</head>
